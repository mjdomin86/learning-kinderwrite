apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: kidwrite-runtime
  namespace: finanzas
spec:
  organizationId: REPLACE_WITH_ORGANIZATION_ID
  secretName: kidwrite-secret
  authToken:
    secretName: bw-auth-token
    secretKey: token
  onlyMappedSecrets: true
  map:
    - bwSecretId: REPLACE_WITH_SECRET_ID
      secretKeyName: ADMIN_PASS
    - bwSecretId: REPLACE_WITH_SECRET_ID
      secretKeyName: COOKIE_SECRET
