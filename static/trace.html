<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#faf8f1">
  <title>KidWrite</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/confetti.browser.min.js" defer></script>
</head>
<body class="trace-body">
  <header class="practice-header"><a id="btn-back" class="back-link" href="/"><span aria-hidden="true">←</span> <span data-i18n="back"></span></a><h1 id="practice-title"></h1><a class="practice-brand" href="/">KidWrite<span class="brand-dot">.</span></a></header>
  <p id="invalid-word" class="status-text" data-i18n="invalid" hidden></p>
  <main id="trace-workspace" class="trace-workspace">
    <div class="practice-topline"><div id="practice-tabs" class="segmented"><button data-phase="trace" aria-pressed="true" data-i18n="trace"></button><button data-phase="copy" aria-pressed="false" data-i18n="copy"></button></div><div id="letter-ribbon" class="letter-ribbon"></div></div>
    <div class="board-heading"><p id="board-hint"></p><div class="board-actions"><button id="btn-listen" class="listen-button" type="button" hidden><svg class="listen-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path class="wave-inner" d="M15.5 8.5a5 5 0 0 1 0 7"/><path class="wave-outer" d="M18.5 5.5a9 9 0 0 1 0 13"/></svg><span id="listen-label"></span></button><span id="step-label"></span></div></div>
    <div id="writing-board" class="writing-board"><canvas id="guide-canvas" aria-hidden="true"></canvas><canvas id="trace-canvas"></canvas></div>
    <div class="drawing-tools"><div id="colour-picker" class="colour-picker" role="group"></div><button id="btn-guide" class="text-button" hidden></button><div class="edit-tools"><button id="btn-undo" class="tool-button" disabled><span aria-hidden="true">↶</span> <span data-i18n="undo"></span></button><button id="btn-clear" class="tool-button" disabled><span aria-hidden="true">⌫</span> <span data-i18n="clear"></span></button></div></div>
    <div class="practice-bottom"><div id="progress-panel" class="progress-panel"><div class="progress-label"><label for="trace-progress" data-i18n="progress"></label><span id="progress-value">0%</span></div><progress id="trace-progress" max="100" value="0"></progress><p id="feedback" role="status"></p></div><p id="practice-note" class="practice-note"></p><button id="btn-next" class="primary-button" hidden></button><button class="secondary-button" data-print-drawing data-i18n="printDrawing" hidden disabled></button><button id="btn-done" class="primary-button" data-i18n="done" hidden disabled></button></div>
  </main>
  <dialog id="celebration" class="celebration" aria-labelledby="celebration-title" aria-describedby="celebration-hint"><div id="sticker" class="reward-sticker" aria-hidden="true">🦊</div><p class="eyebrow" data-i18n="sticker"></p><h2 id="celebration-title"></h2><p id="celebration-hint" data-i18n="celebrationHint"></p><p id="sticker-save-status" role="status"></p><button class="secondary-button" data-open-album data-i18n="album"></button><button class="secondary-button" data-print-drawing data-i18n="printDrawing" hidden disabled></button><a id="another-word" class="primary-button" href="/" data-i18n="another"></a><button id="btn-again" class="text-button" data-i18n="again"></button></dialog>
  <div id="print-sheet"><canvas id="print-artwork"></canvas></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
